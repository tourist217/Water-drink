<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Осушение пруда: 8 палаток и водонапорная башня</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #17171d;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      background: #507d30;
      border: 3px solid #274514;
      border-radius: 12px;
      display: block;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 950px;
    }
    button {
      padding: 10px 16px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #ffb300;
      color: #212121;
      transition: all 0.2s;
    }
    button:hover:not(:disabled) {
      background: #ffa000;
      transform: translateY(-1px);
    }
    button:disabled {
      background: #383840;
      color: #72727a;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <h1>Осушение пруда (8 палаток + Водонапорная башня)</h1>
  <canvas id="gameCanvas" width="960" height="580"></canvas>

  <div class="controls">
    <button id="btnCup" onclick="buyCup()">Кружка</button>
    <button id="btnSpeed" onclick="buySpeed()">Скорость</button>
    <button id="btnTent" onclick="buyTent()">Купить палатку</button>
    <button id="btnWorker" onclick="buyWorker()">Поселить жильца</button>
    <button id="btnTower" onclick="upgradeTower()">Водонапорная башня</button>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- БАЛАНС И СОСТОЯНИЕ ---
let money = 0;                  // Ресурсы (выпитые литры)
const maxPondWater = 10000;     // Исходный объем пруда
let pondWater = maxPondWater;

const pondCenter = { x: 480, y: 310 };
const pondRadiusX = 145;
const pondRadiusY = 85;

// Кружка (до 1.0 л)
let cupCapacity = 0.2;
const maxCupCapacity = 1.0;
const cupStep = 0.2;
let cupPrice = 1;

// Скорость (3 уровня)
let speedLevel = 1;
const maxSpeedLevel = 3;
const speedValues = [1.5, 2.2, 3.0];
let speedPrice = 2.5;

// Водонапорная башня (3 уровня)
let towerLevel = 0; // 0 - не построена, 1, 2, 3
const towerPrices = [40, 120, 300];
const towerPumpSpeeds = [0, 2.0, 6.0, 15.0]; // Литров в секунду (при 60 FPS делим на 60)
const towerPos = { x: 480, y: 195 };

// Палатки (8 штук вокруг пруда)
const tentColors = [
  '#d35400', '#2980b9', '#8e44ad', '#16a085',
  '#c0392b', '#27ae60', '#f39c12', '#34495e'
];
const tentPrices = [0, 10, 20, 35, 55, 80, 110, 150];
const tentSlots = [];
const MAX_PER_TENT = 3;

// Генерируем 8 точек по эллиптической орбите вокруг пруда
const tentDistanceX = 330;
const tentDistanceY = 200;
for (let i = 0; i < 8; i++) {
  const angle = (i / 8) * (Math.PI * 2) - Math.PI / 2;
  tentSlots.push({
    id: i,
    x: pondCenter.x + Math.cos(angle) * tentDistanceX,
    y: pondCenter.y + Math.sin(angle) * tentDistanceY,
    color: tentColors[i],
    bought: i === 0, // первая палатка бесплатная
    workers: 0
  });
}

let workerPrice = 4;
const workers = [];

function getActiveTentsCount() {
  return tentSlots.filter(t => t.bought).length;
}

function getTotalCapacity() {
  return getActiveTentsCount() * MAX_PER_TENT;
}

// Создание человека
function spawnWorkerForTent(tent) {
  tent.workers++;
  const dx = pondCenter.x - tent.x;
  const dy = pondCenter.y - tent.y;
  const angle = Math.atan2(dy, dx);

  const targetX = pondCenter.x - Math.cos(angle) * (pondRadiusX * 0.85);
  const targetY = pondCenter.y - Math.sin(angle) * (pondRadiusY * 0.85);

  workers.push({
    tentId: tent.id,
    homeX: tent.x,
    homeY: tent.y,
    x: tent.x,
    y: tent.y,
    targetX: targetX,
    targetY: targetY,
    state: 'TO_WATER',
    drunkAmount: 0,
    belly: 0,
    timer: 0,
    tentColor: tent.color
  });
}

// Стартовый житель в бесплатной палатке
spawnWorkerForTent(tentSlots[0]);

// --- АПГРЕЙДЫ ---
function buyCup() {
  if (cupCapacity < maxCupCapacity && money >= cupPrice) {
    money -= cupPrice;
    cupCapacity = Math.min(maxCupCapacity, +(cupCapacity + cupStep).toFixed(1));
    cupPrice = +(cupPrice * 1.8).toFixed(1);
    updateButtonsUI();
  }
}

function buySpeed() {
  if (speedLevel < maxSpeedLevel && money >= speedPrice) {
    money -= speedPrice;
    speedLevel++;
    speedPrice = +(speedPrice * 2.1).toFixed(1);
    updateButtonsUI();
  }
}

function buyTent() {
  const nextTent = tentSlots.find(t => !t.bought);
  if (nextTent) {
    const cost = tentPrices[nextTent.id];
    if (money >= cost) {
      money -= cost;
      nextTent.bought = true;
      // При создании палатки сразу создаём 1 жителя бесплатно!
      spawnWorkerForTent(nextTent);
      updateButtonsUI();
    }
  }
}

function buyWorker() {
  const availableTent = tentSlots.find(t => t.bought && t.workers < MAX_PER_TENT);
  if (availableTent && money >= workerPrice) {
    money -= workerPrice;
    spawnWorkerForTent(availableTent);
    workerPrice = Math.round(workerPrice * 1.6);
    updateButtonsUI();
  }
}

function upgradeTower() {
  if (towerLevel < 3) {
    const cost = towerPrices[towerLevel];
    if (money >= cost) {
      money -= cost;
      towerLevel++;
      updateButtonsUI();
    }
  }
}

// Интерфейс кнопок
function updateButtonsUI() {
  // Кружка
  const btnCup = document.getElementById('btnCup');
  if (cupCapacity >= maxCupCapacity) {
    btnCup.innerText = `Кружка: 1.0 л [МАКС]`;
    btnCup.disabled = true;
  } else {
    btnCup.innerText = `Кружка: ${cupCapacity}л ➜ ${(cupCapacity + cupStep).toFixed(1)}л (${cupPrice} л)`;
    btnCup.disabled = money < cupPrice;
  }

  // Скорость
  const btnSpeed = document.getElementById('btnSpeed');
  if (speedLevel >= maxSpeedLevel) {
    btnSpeed.innerText = `Скорость: ур.${speedLevel}/3 [МАКС]`;
    btnSpeed.disabled = true;
  } else {
    btnSpeed.innerText = `Скорость: ур.${speedLevel + 1} (${speedPrice} л)`;
    btnSpeed.disabled = money < speedPrice;
  }

  // Палатка (+1 житель сразу)
  const btnTent = document.getElementById('btnTent');
  const nextTent = tentSlots.find(t => !t.bought);
  if (!nextTent) {
    btnTent.innerText = `Палатки: 8/8 [МАКС]`;
    btnTent.disabled = true;
  } else {
    const cost = tentPrices[nextTent.id];
    btnTent.innerText = `Купить палатку #${nextTent.id + 1} + 1 житель (${cost} л)`;
    btnTent.disabled = money < cost;
  }

  // Жильцы
  const btnWorker = document.getElementById('btnWorker');
  const availableTent = tentSlots.find(t => t.bought && t.workers < MAX_PER_TENT);
  if (!availableTent) {
    btnWorker.innerText = getActiveTentsCount() < 8 ? `Купите палатку!` : `Все 8 палаток полны [24/24]`;
    btnWorker.disabled = true;
  } else {
    btnWorker.innerText = `Доселить жильца [${workers.length}/${getTotalCapacity()}] (${workerPrice} л)`;
    btnWorker.disabled = money < workerPrice;
  }

  // Водонапорная башня
  const btnTower = document.getElementById('btnTower');
  if (towerLevel === 0) {
    btnTower.innerText = `Построить башню (ур.1: 2 л/с) — ${towerPrices[0]} л`;
    btnTower.disabled = money < towerPrices[0];
  } else if (towerLevel < 3) {
    btnTower.innerText = `Башня ур.${towerLevel + 1} (${towerPumpSpeeds[towerLevel + 1]} л/с) — ${towerPrices[towerLevel]} л`;
    btnTower.disabled = money < towerPrices[towerLevel];
  } else {
    btnTower.innerText = `Башня: ур.3 (15 л/с) [МАКС]`;
    btnTower.disabled = true;
  }
}

// --- ЛОГИКА (UPDATE) ---
function update() {
  const currentSpeed = speedValues[speedLevel - 1];

  // 1. Работа башни (откачка воды напрямую в ресурсы)
  if (towerLevel > 0 && pondWater > 0) {
    const pumped = Math.min(pondWater, towerPumpSpeeds[towerLevel] / 60);
    pondWater -= pumped;
    money += pumped;
  }

  // 2. Логика человечков
  workers.forEach(w => {
    switch (w.state) {
      case 'TO_WATER':
        if (pondWater <= 0) break;
        const dx = w.targetX - w.x;
        const dy = w.targetY - w.y;
        const dist = Math.hypot(dx, dy);

        if (dist <= currentSpeed) {
          w.x = w.targetX;
          w.y = w.targetY;
          w.state = 'DRINKING';
        } else {
          w.x += (dx / dist) * currentSpeed;
          w.y += (dy / dist) * currentSpeed;
        }
        break;

      case 'DRINKING':
        if (pondWater <= 0 || w.drunkAmount >= cupCapacity) {
          w.state = 'TO_TENT';
          break;
        }
        const sip = Math.min(0.008, pondWater, cupCapacity - w.drunkAmount);
        pondWater -= sip;
        w.drunkAmount += sip;
        w.belly = (w.drunkAmount / cupCapacity) * 9;
        break;

      case 'TO_TENT':
        const backDx = w.homeX - w.x;
        const backDy = w.homeY - w.y;
        const backDist = Math.hypot(backDx, backDy);

        if (backDist <= currentSpeed) {
          w.x = w.homeX;
          w.y = w.homeY;
          w.state = 'RESTING';
          w.timer = 20;
        } else {
          w.x += (backDx / backDist) * currentSpeed;
          w.y += (backDy / backDist) * currentSpeed;
        }
        break;

      case 'RESTING':
        w.timer--;
        if (w.timer <= 0) {
          money += w.drunkAmount;
          w.drunkAmount = 0;
          w.belly = 0;
          w.state = pondWater > 0 ? 'TO_WATER' : 'RESTING';
        }
        break;
    }
  });

  updateButtonsUI();
}

// --- ОТРИСОВКА (DRAW) ---
let pulseTick = 0;
function draw() {
  pulseTick++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Дно пруда
  ctx.fillStyle = '#4a3424';
  ctx.beginPath();
  ctx.ellipse(pondCenter.x, pondCenter.y, pondRadiusX, pondRadiusY, 0, 0, Math.PI * 2);
  ctx.fill();

  // 2. Вода в пруду
  const ratio = Math.max(0, pondWater / maxPondWater);
  if (ratio > 0) {
    ctx.fillStyle = '#29b6f6';
    ctx.beginPath();
    ctx.ellipse(
      pondCenter.x, 
      pondCenter.y + (1 - ratio) * 15, 
      (pondRadiusX - 10) * ratio, 
      (pondRadiusY - 10) * ratio, 
      0, 0, Math.PI * 2
    );
    ctx.fill();
  } else {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('10 000 литров выпиты!', pondCenter.x, pondCenter.y + 6);
    ctx.textAlign = 'start';
  }

  // 3. Водонапорная башня
  if (towerLevel > 0) {
    // Труба в воду
    ctx.strokeStyle = '#7f8c8d';
    ctx.lineWidth = 6 + towerLevel * 2;
    ctx.beginPath();
    ctx.moveTo(towerPos.x, towerPos.y + 15);
    ctx.lineTo(pondCenter.x, pondCenter.y - 20);
    ctx.stroke();

    // Опоры башни
    ctx.strokeStyle = '#bdc3c7';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(towerPos.x - 20, towerPos.y + 30);
    ctx.lineTo(towerPos.x, towerPos.y - 10);
    ctx.lineTo(towerPos.x + 20, towerPos.y + 30);
    ctx.stroke();

    // Бак башни
    const tankColors = ['#95a5a6', '#3498db', '#e74c3c'];
    ctx.fillStyle = tankColors[towerLevel - 1];
    ctx.beginPath();
    ctx.roundRect(towerPos.x - 24, towerPos.y - 45, 48, 38, 8);
    ctx.fill();
    ctx.strokeStyle = '#2c3e50';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Пульсация выкачки воды
    if (pondWater > 0) {
      ctx.fillStyle = '#00e5ff';
      const pulse = (Math.sin(pulseTick * 0.1) + 1) * 3;
      ctx.beginPath();
      ctx.arc(pondCenter.x, pondCenter.y - 20, 5 + pulse, 0, Math.PI * 2);
      ctx.fill();
    }

    // Подпись башни
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(`Башня Ур.${towerLevel} (${towerPumpSpeeds[towerLevel]} л/с)`, towerPos.x, towerPos.y - 52);
    ctx.textAlign = 'start';
  } else {
    // Место под башню (пунктир)
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(towerPos.x - 25, towerPos.y - 40, 50, 60);
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Место под башню', towerPos.x, towerPos.y - 10);
    ctx.textAlign = 'start';
  }

  // 4. Палатки (8 шт)
  tentSlots.forEach(slot => {
    if (slot.bought) {
      ctx.fillStyle = slot.color;
      ctx.beginPath();
      ctx.moveTo(slot.x - 24, slot.y + 20);
      ctx.lineTo(slot.x, slot.y - 22);
      ctx.lineTo(slot.x + 24, slot.y + 20);
      ctx.closePath();
      ctx.fill();

      // Вход
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.moveTo(slot.x - 8, slot.y + 20);
      ctx.lineTo(slot.x, slot.y + 2);
      ctx.lineTo(slot.x + 8, slot.y + 20);
      ctx.closePath();
      ctx.fill();

      // Счетчик жильцов
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(`${slot.workers}/${MAX_PER_TENT}`, slot.x, slot.y + 32);
      ctx.textAlign = 'start';
    } else {
      // Пустой слот
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 5]);
      ctx.strokeRect(slot.x - 25, slot.y - 18, 50, 36);
      ctx.setLineDash([]);

      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = '10px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(`Палатка #${slot.id + 1}`, slot.x, slot.y - 2);
      ctx.fillText(`${tentPrices[slot.id]} л`, slot.x, slot.y + 11);
      ctx.textAlign = 'start';
    }
  });

  // 5. Человечки (сортировка по Y)
  const sortedWorkers = [...workers].sort((a, b) => a.y - b.y);

  sortedWorkers.forEach(w => {
    if (w.state === 'RESTING') return;

    // Тело
    ctx.fillStyle = w.tentColor;
    ctx.fillRect(w.x - 6, w.y - 19, 12, 19);

    // Голова
    ctx.fillStyle = '#ffd1b3';
    ctx.beginPath();
    ctx.arc(w.x, w.y - 25, 6, 0, Math.PI * 2);
    ctx.fill();

    // Кружка
    ctx.fillStyle = '#ffffff';
    const cupHeight = 5 + (cupCapacity * 5);
    ctx.fillRect(w.x + 5, w.y - 15, 4, cupHeight);

    // Живот
    if (w.belly > 0) {
      ctx.fillStyle = '#e67e22';
      ctx.beginPath();
      ctx.arc(w.x, w.y - 9, w.belly * 0.8, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // 6. HUD (Интерфейс сверху)
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 15px Arial';
  ctx.fillText(`Вода в пруду: ${Math.round(pondWater)} / ${maxPondWater} л`, 20, 25);
  ctx.fillText(`Ресурсы: ${money.toFixed(1)} л`, 20, 48);
  ctx.fillText(`Кружка: ${cupCapacity.toFixed(1)} л | Скорость: ${speedLevel}/3`, 20, 71);
  ctx.fillText(`Лагерь: ${workers.length} чел (палаток: ${getActiveTentsCount()}/8)`, 20, 94);
  if (towerLevel > 0) {
    ctx.fillStyle = '#00e5ff';
    ctx.fillText(`Башня откачивает: +${towerPumpSpeeds[towerLevel]} л/сек`, 20, 117);
  }
}

// Главный цикл
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
