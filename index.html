<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Осушение пруда: Баланс с лимитами</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #1e1e24;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      background: #689f38;
      border: 3px solid #33691e;
      border-radius: 8px;
      display: block;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 12px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #ffb300;
      color: #212121;
      transition: 0.2s;
    }
    button:hover:not(:disabled) {
      background: #ffa000;
    }
    button:disabled {
      background: #474747;
      color: #888;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <h1>Осушение пруда (10 000 л)</h1>
  <canvas id="gameCanvas" width="800" height="420"></canvas>

  <div class="controls">
    <button id="btnCup" onclick="buyCup()">Кружка</button>
    <button id="btnSpeed" onclick="buySpeed()">Скорость</button>
    <button id="btnSpawn" onclick="buyWorker()">Нанять человека</button>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- ИГРОВОЙ БАЛАНС (В ЛИТРАХ) ---
let money = 0;                  // Накопленные литры ($)
const maxPondWater = 10000;     // Всего воды в пруду
let pondWater = maxPondWater;

// 1. Лимиты кружки (до 1.0 л)
let cupCapacity = 0.2;          // Стартовый объем: 0.2 л
const maxCupCapacity = 1.0;     // Максимальный объем: 1.0 л
const cupStep = 0.2;            // Шаг прокачки: +0.2 л
let cupPrice = 2;               // Стартовая цена в литрах

// 2. Лимиты скорости (всего 3 уровня)
let speedLevel = 1;
const maxSpeedLevel = 3;
const speedValues = [1.5, 2.2, 3.0]; // Скорости для 1, 2 и 3 уровней
let speedPrice = 5;

// 3. Лимиты людей (максимум 5 человек)
const maxWorkers = 5;
let workerPrice = 10;

const tentPos = { x: 90, y: 260 };
const waterEdgeX = 510;

// Массив рабочих
const workers = [];

function createWorker(index) {
  // Небольшое смещение по Y (от -20 до +20), чтобы человечки шли не в одну линию
  const yOffset = (index - 2) * 12;
  return {
    x: tentPos.x,
    y: tentPos.y + yOffset,
    state: 'TO_WATER',
    drunkAmount: 0,
    belly: 0,
    timer: 0
  };
}

// Добавляем первого рабочего на старте
workers.push(createWorker(0));

// --- СИСТЕМА УЛУЧШЕНИЙ ---
function buyCup() {
  if (cupCapacity < maxCupCapacity && money >= cupPrice) {
    money -= cupPrice;
    cupCapacity = Math.min(maxCupCapacity, +(cupCapacity + cupStep).toFixed(1));
    cupPrice = Math.round(cupPrice * 1.8);
    updateButtonsUI();
  }
}

function buySpeed() {
  if (speedLevel < maxSpeedLevel && money >= speedPrice) {
    money -= speedPrice;
    speedLevel++;
    speedPrice = Math.round(speedPrice * 2.2);
    updateButtonsUI();
  }
}

function buyWorker() {
  if (workers.length < maxWorkers && money >= workerPrice) {
    money -= workerPrice;
    workers.push(createWorker(workers.length));
    workerPrice = Math.round(workerPrice * 2.5);
    updateButtonsUI();
  }
}

// Обновление текста на кнопках
function updateButtonsUI() {
  const currentSpeed = speedValues[speedLevel - 1];

  // Кнопка кружки
  const btnCup = document.getElementById('btnCup');
  if (cupCapacity >= maxCupCapacity) {
    btnCup.innerText = `Кружка: 1.0 л [МАКС]`;
    btnCup.disabled = true;
  } else {
    btnCup.innerText = `Кружка: ${cupCapacity}л ➜ ${(cupCapacity + cupStep).toFixed(1)}л (${cupPrice} л)`;
    btnCup.disabled = money < cupPrice;
  }

  // Кнопка скорости
  const btnSpeed = document.getElementById('btnSpeed');
  if (speedLevel >= maxSpeedLevel) {
    btnSpeed.innerText = `Скорость: ур.${speedLevel}/${maxSpeedLevel} [МАКС]`;
    btnSpeed.disabled = true;
  } else {
    btnSpeed.innerText = `Скорость: ур.${speedLevel + 1} (${speedPrice} л)`;
    btnSpeed.disabled = money < speedPrice;
  }

  // Кнопка найма
  const btnSpawn = document.getElementById('btnSpawn');
  if (workers.length >= maxWorkers) {
    btnSpawn.innerText = `Люди: 5/5 [МАКС]`;
    btnSpawn.disabled = true;
  } else {
    btnSpawn.innerText = `Нанять человека [${workers.length}/${maxWorkers}] (${workerPrice} л)`;
    btnSpawn.disabled = money < workerPrice;
  }
}

// --- ИГРОВОЙ ЦИКЛ (UPDATE) ---
function update() {
  const currentSpeed = speedValues[speedLevel - 1];

  workers.forEach(w => {
    switch (w.state) {
      case 'TO_WATER':
        if (pondWater <= 0) break;
        w.x += currentSpeed;
        if (w.x >= waterEdgeX) {
          w.x = waterEdgeX;
          w.state = 'DRINKING';
        }
        break;

      case 'DRINKING':
        if (pondWater <= 0 || w.drunkAmount >= cupCapacity) {
          w.state = 'TO_TENT';
          break;
        }
        // Скорость питья: 0.008 л за кадр (~0.5 л/сек)
        const sip = Math.min(0.008, pondWater, cupCapacity - w.drunkAmount);
        pondWater -= sip;
        w.drunkAmount += sip;
        w.belly = (w.drunkAmount / cupCapacity) * 10;
        break;

      case 'TO_TENT':
        w.x -= currentSpeed;
        if (w.x <= tentPos.x) {
          w.x = tentPos.x;
          w.state = 'RESTING';
          w.timer = 30; // 0.5 сек отдыха
        }
        break;

      case 'RESTING':
        w.timer--;
        if (w.timer <= 0) {
          money += w.drunkAmount;
          w.drunkAmount = 0;
          w.belly = 0;
          w.state = pondWater > 0 ? 'TO_WATER' : 'RESTING';
        }
        break;
    }
  });

  updateButtonsUI();
}

// --- ОТРИСОВКА (DRAW) ---
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Палатка
  ctx.fillStyle = '#d35400';
  ctx.beginPath();
  ctx.moveTo(20, 310);
  ctx.lineTo(90, 170);
  ctx.lineTo(160, 310);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#2c3e50';
  ctx.beginPath();
  ctx.moveTo(70, 310);
  ctx.lineTo(90, 230);
  ctx.lineTo(110, 310);
  ctx.closePath();
  ctx.fill();

  // 2. Дно пруда
  ctx.fillStyle = '#4e3629';
  ctx.beginPath();
  ctx.ellipse(620, 270, 140, 85, 0, 0, Math.PI * 2);
  ctx.fill();

  // 3. Вода (уменьшается плавно по мере выпивания 10 000 л)
  const ratio = Math.max(0, pondWater / maxPondWater);
  if (ratio > 0) {
    ctx.fillStyle = '#29b6f6';
    ctx.beginPath();
    ctx.ellipse(620, 270 + (1 - ratio) * 25, 130 * ratio, 75 * ratio, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px Arial';
    ctx.fillText('10 000 литров выпиты!', 520, 275);
  }

  // 4. Отрисовка человечков
  // Сортируем по Y, чтобы те, кто ниже, перекрывали тех, кто выше (иллюзия глубины)
  const sortedWorkers = [...workers].sort((a, b) => a.y - b.y);

  sortedWorkers.forEach(w => {
    // Тело
    ctx.fillStyle = '#34495e';
    ctx.fillRect(w.x - 8, w.y - 26, 16, 26);

    // Голова
    ctx.fillStyle = '#f1c40f';
    ctx.beginPath();
    ctx.arc(w.x, w.y - 34, 8, 0, Math.PI * 2);
    ctx.fill();

    // Кружка / Бутылка
    ctx.fillStyle = '#ffffff';
    const cupOffsetX = w.state === 'TO_TENT' ? -12 : 8;
    // Высота кружки увеличивается с прокачкой
    const cupHeight = 8 + (cupCapacity * 6);
    ctx.fillRect(w.x + cupOffsetX, w.y - 20, 6, cupHeight);

    // Раздувающийся живот
    if (w.belly > 0) {
      ctx.fillStyle = '#e67e22';
      ctx.beginPath();
      ctx.arc(w.x, w.y - 12, w.belly, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // 5. Интерфейс (HUD)
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 16px Arial';
  ctx.fillText(`Вода в пруду: ${Math.round(pondWater)} / ${maxPondWater} л`, 20, 35);
  ctx.fillText(`Доступно для покупок: ${money.toFixed(1)} л`, 20, 60);
  ctx.fillText(`Текущий объём кружки: ${cupCapacity.toFixed(1)} л`, 20, 85);
  ctx.fillText(`Скорость бега: Уровень ${speedLevel} из ${maxSpeedLevel}`, 20, 110);
  ctx.fillText(`Людей на водоёме: ${workers.length} из ${maxWorkers}`, 20, 135);
}

// Главный цикл
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
